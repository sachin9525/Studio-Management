<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVML — Luxury Wedding & Event Cinema Studio</title>
    <meta name="description" content="India's luxury fine-art photography and cinematic film studio platform." />
    <!-- Preconnect to image CDNs for ultra-fast asset delivery -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <script>
      (function() {
        try {
          var explicit = localStorage.getItem('svml_theme_user_set');
          var saved = localStorage.getItem('svml_theme');
          var isDark = explicit && saved === 'dark';
          var root = document.documentElement;
          if (isDark) {
            root.classList.remove('light');
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
